<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser MCP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 0 !important;
    }

    :root {
      --bg-app: #09090b;
      --card-bg: #121214;
      --border-color: #27272a;
      --border-hover: #3f3f46;

      --text-main: #f4f4f5;
      --text-muted: #71717a;
      --text-inverse: #000000;

      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-glow: rgba(59, 130, 246, 0.15);

      --success: #10b981;
      --success-bg: #061a14;
      --success-border: #047857;

      --warning: #f59e0b;
      --warning-bg: #1c1202;
      --warning-border: #b45309;

      --console-bg: #0c0c0e;

      --transition-speed: 0.15s;
    }

    body {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      background-color: var(--bg-app);
      color: var(--text-main);
      padding: 0;
      min-height: auto;
    }

    .mcp-container {
      display: flex;
      flex-direction: column;
      width: 360px;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .mcp-card {
      background: var(--card-bg);
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .mcp-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .mcp-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mcp-logo {
      height: 22px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 4px rgba(255, 255, 255, 0.1));
    }

    .mcp-title {
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .status-banner {
      background-color: var(--success-bg);
      border: 1px solid var(--border-color);
      border-left: 3px solid var(--success);
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all var(--transition-speed) ease;
    }

    .status-banner.connecting {
      background-color: var(--warning-bg);
      border-left-color: var(--warning);
    }

    .status-text-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--text-main);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background-color: var(--success);
      display: inline-block;
      box-shadow: 0 0 8px var(--success);
    }

    .status-banner.connecting .status-dot {
      background-color: var(--warning);
      box-shadow: 0 0 8px var(--warning);
      animation: alert-blink 1s infinite steps(2);
    }

    @keyframes alert-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .server-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.6875rem;
      color: var(--text-muted);
    }

    .server-latency {
      color: var(--success);
      font-weight: bold;
    }

    .status-banner.connecting .server-latency {
      color: var(--warning);
    }

    .action-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all var(--transition-speed) ease;
      border: 1px solid transparent;
      user-select: none;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #1c1c1e;
      border-color: var(--border-hover);
    }

    .btn-primary {
      background-color: var(--text-main);
      color: var(--text-inverse);
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      color: var(--text-inverse);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .mcp-console {
      background-color: var(--console-bg);
      border-top: 1px solid var(--border-color);
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: #121214;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      user-select: none;
    }

    .console-title {
      color: var(--text-muted);
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .console-indicator {
      display: flex;
      align-items: center;
      color: var(--text-muted);
      transition: transform var(--transition-speed) ease;
    }

    .console-indicator.collapsed {
      transform: rotate(-90deg);
    }

    .console-logs {
      max-height: 110px;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.6875rem;
      transition: max-height var(--transition-speed) ease, padding var(--transition-speed) ease;
    }

    .console-logs.collapsed {
      max-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .log-entry {
      color: #38bdf8;
      line-height: 1.4;
      display: flex;
      gap: 8px;
    }

    .log-timestamp {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .log-content {
      word-break: break-all;
    }

    .spinner {
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="mcp-container">
    <div class="mcp-card">

      <div class="mcp-header">
        <div class="mcp-brand">
          <img src="icon128.png" alt="Logo" class="mcp-logo">
          <span class="mcp-title">Browser MCP</span>
        </div>
      </div>

      <div class="status-banner" id="status-banner">
        <div class="status-text-wrapper">
          <span class="status-dot"></span>
          <span id="status-label">CHECKING...</span>
        </div>
        <div class="server-meta">
          <span class="server-id" id="server-id">ID: --</span>
          <span class="server-latency" id="latency">--</span>
        </div>
      </div>

      <div class="action-group">
        <button class="btn btn-secondary" id="reconnect-btn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="reconnect-svg"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path></svg>
          Reconnect
        </button>
        <button class="btn btn-primary" id="control-btn">Control Tab</button>
      </div>
    </div>

    <div class="mcp-console">
      <div class="console-header" id="console-hdr">
        <span class="console-title">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
          Protocol Server Logs
        </span>
        <span class="console-indicator" id="console-indicator">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </span>
      </div>
      <div class="console-logs" id="console-body"></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
